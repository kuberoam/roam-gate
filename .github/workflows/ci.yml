name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: azure/setup-helm@v4
      - run: |
          helm lint chart/roam-gate
          helm template t chart/roam-gate -n roam-system > /dev/null
          helm template t chart/roam-gate -n roam-system --set tls.mode=none,ingress.enabled=true,ingress.host=gate.example.com,eks.awsAuth=true > /dev/null
          helm template t chart/roam-gate -n roam-system --api-versions=cert-manager.io/v1 --set tls.mode=certManager,tls.issuer.name=letsencrypt,ingress.enabled=true,ingress.host=gate.example.com,ingress.issuer.name=letsencrypt > /dev/null
          # The schema rejects bad values.
          ! helm template t chart/roam-gate --set tls.mode=bogus > /dev/null 2>&1
          ! helm template t chart/roam-gate --set ingress.enabled=true > /dev/null 2>&1
