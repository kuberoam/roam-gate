# Tag vX.Y.Z → image ghcr.io/kuberoam/roam-gate:X.Y.Z, chart oci://ghcr.io/kuberoam/charts/roam-gate:X.Y.Z
# and a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/kuberoam/roam-gate:${{ steps.v.outputs.version }}
            ghcr.io/kuberoam/roam-gate:latest
          labels: |
            org.opencontainers.image.source=https://github.com/kuberoam/roam-gate
            org.opencontainers.image.description=Roam Gate: lightweight access control for Kubernetes
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: azure/setup-helm@v4
      - name: Chart
        run: |
          helm lint chart/roam-gate
          helm package chart/roam-gate --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/roam-gate-${{ steps.v.outputs.version }}.tgz oci://ghcr.io/kuberoam/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "Roam Gate ${{ steps.v.outputs.version }}" --notes "$(cat <<NOTES
          Image: \`ghcr.io/kuberoam/roam-gate:${{ steps.v.outputs.version }}\` (linux/amd64, linux/arm64)

          \`\`\`sh
          helm install roam-gate oci://ghcr.io/kuberoam/charts/roam-gate --version ${{ steps.v.outputs.version }} \\
            --namespace roam-system --create-namespace --set externalURL=https://gate.example.com
          \`\`\`
          NOTES
          )"
