{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
{{- /* The size is set at install: an upgrade keeps the volume's size, so a new
  default (or a smaller value) never asks to resize or shrink it. */ -}}
{{- $old := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-data" (include "gate.name" .)) -}}
{{- $size := .Values.persistence.size -}}
{{- if and $old $old.spec -}}{{- $size = $old.spec.resources.requests.storage -}}{{- end -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gate.name" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gate.labels" . | nindent 4 }}
  {{- if .Values.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $size }}
{{- end }}
