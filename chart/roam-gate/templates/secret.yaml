{{- /* Generated once, then kept across upgrades. */ -}}
{{- $name := printf "%s-secrets" (include "gate.name" .) -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $old $old.data -}}
{{- $data = $old.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gate.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # 32 random bytes (base64): encrypts stored provider secrets, signs sign-in state.
  secret-key: {{ get $data "secret-key" | default (randAscii 32 | b64enc | b64enc) }}
  # Bootstrap admin token for the Gate API (Authorization: Bearer ...).
  admin-token: {{ get $data "admin-token" | default (printf "rga_%s" (randAlphaNum 40) | b64enc) }}
