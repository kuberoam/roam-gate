apiVersion: v1
kind: Service
metadata:
  name: {{ include "gate.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "gate.selector" . | nindent 4 }}
  ports:
    - name: {{ lower (include "gate.scheme" .) }}
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
